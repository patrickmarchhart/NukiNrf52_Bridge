CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_DM=y
CONFIG_BT_SMP=n
CONFIG_BT_MAX_CONN=1
CONFIG_BT_DEVICE_NAME="Nuki Central"

# Nuki uses its own app-layer crypto (Curve25519 + HSalsa20/Salsa20 +
# Poly1305 + HMAC-SHA256), not BLE link-layer pairing/bonding.
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_CRYPTO_SYS_INIT=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ECC_MONTGOMERY_255=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
CONFIG_PSA_WANT_KEY_TYPE_RAW_DATA=y

# Persist pairing credentials (authorization id + shared secret) across reboots.
CONFIG_SETTINGS=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# Interactive control (no phone app in this project): nuki pair/lock/unlock/unlatch/state.
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_CBPRINTF_FP_SUPPORT=y

# Without this, every LOG_INF/LOG_ERR/LOG_WRN call in the app is compiled
# out entirely - only explicit shell_print/shell_error output would show.
# Immediate mode (rather than deferred) avoids silently dropping messages
# when scanning generates a burst of log lines faster than they can be
# printed over UART.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Larger ATT MTU so a full Nuki frame fits in a single GATT write instead of
# requiring the long-write (prepare/execute) procedure.
CONFIG_BT_L2CAP_TX_MTU=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192

# Default (1200B) is too small once scan/GATT callbacks (device_found(),
# AD parsing, logging) do more than trivial work - all such callbacks run
# on this thread. Caused an MPU stack-overflow fault during scanning.
CONFIG_BT_RX_STACK_SIZE=4096

# Second UART (uart1, see boards/nrf52840dk_nrf52840.overlay) carrying the
# plain-text machine protocol for the external Loxone module - kept
# separate from the interactive shell/log console on uart0.
CONFIG_UART_INTERRUPT_DRIVEN=y
